# 按图2布置；安装坐标由现有 CAD 估算，并非实车测量标定。
# ROS FLU: +x 前进，+y 左，+z 上；位置 m，角度 rad。
# base_link 位于四个轮毂中心的水平中点，z=0 为地面；sensor_kit_base_link 默认与其重合。
# L1 顶部正装；L2/L3 左前/左后高位倒装；L4/L5 右前/右中低位倒装。
# roll=pi 表示倒装，不要再在点云驱动中重复施加该外参。
# 坐标原点为简化雷达外壳中心，实机需按厂家光学原点重新标定。
sensor_kit_base_link:
  mid360_l1_base_link:
    x: 0.83
    y: 0.44
    z: 1.885
    roll: 0.0
    pitch: 0.0
    yaw: 0.0
  mid360_l2_base_link:
