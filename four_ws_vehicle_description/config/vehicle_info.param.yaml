# CAD-derived loaded envelope, SI units. base_link is at the mean of the four wheel centres.
# Front and rear overhangs are measured from the axles. Vehicle height is measured from the ground.
# max_steer_angle=0.70 is a PROVISIONAL front-steer bicycle limit for stock Autoware.
# Independent 4WS limits are in four_ws_vehicle_launch/config/simulation_limits.yaml.
/**:
  ros__parameters:
    wheel_radius: 0.175
    wheel_width: 0.1
    wheel_base: 1.2165
    wheel_tread: 0.68
    front_overhang: 0.7335024240553252
    rear_overhang: 0.7299975759446751
    left_overhang: 0.25667496053031696
    right_overhang: 0.4023940091962455
    vehicle_height: 1.915
    max_steer_angle: 0.7
