# 五个 Livox MID-360，外参读取 sensor_kit_calibration.yaml（ROS FLU）。
# CARLA ray_cast 仅近似 360° / -7°~52° / 200000 点/s；不复现非重复扫描。
# channels=64 是仿真离散化参数，MID-360 不是“64线雷达”。
# 70 m 是高反射率目标参考上限，并非所有目标的保证距离。
# 所有 FOV 均为雷达局部坐标；倒装由标定 roll=pi 完成，不再倒转 FOV。
# 桥接器仍须负责 ROS FLU 与 CARLA FRU 的坐标转换。
# 官方参数：https://www.livoxtech.com/mid-360/specs
default_sensor_kit_name: four_ws_sensor_kit_description
sensor_mappings:
  mid360_l1_base_link:
    carla_type: sensor.lidar.ray_cast
    id: l1
    ros_config:
      frame_id: mid360_l1
      topic_base: /sensing/lidar/l1
      topic_suffix: /pointcloud_before_sync
      frequency_hz: 10
      qos_profile: best_effort
    parameters:
      range: 70
      channels: 64
      points_per_second: 200000
      horizontal_fov: 360.0
      upper_fov: 52.0
      lower_fov: -7.0
      rotation_frequency: 10
      noise_stddev: 0.0
  mid360_l2_base_link:
    carla_type: sensor.lidar.ray_cast
    id: l2
    ros_config:
      frame_id: mid360_l2
      topic_base: /sensing/lidar/l2
      topic_suffix: /pointcloud_before_sync
      frequency_hz: 10
      qos_profile: best_effort
    parameters:
      range: 70
      channels: 64
      points_per_second: 200000
      horizontal_fov: 360.0
      upper_fov: 52.0
      lower_fov: -7.0
      rotation_frequency: 10
      noise_stddev: 0.0
  mid360_l3_base_link:
    carla_type: sensor.lidar.ray_cast
    id: l3
    ros_config:
      frame_id: mid360_l3
      topic_base: /sensing/lidar/l3
      topic_suffix: /pointcloud_before_sync
      frequency_hz: 10
      qos_profile: best_effort
    parameters:
      range: 70
      channels: 64
      points_per_second: 200000
      horizontal_fov: 360.0
      upper_fov: 52.0
      lower_fov: -7.0
      rotation_frequency: 10
      noise_stddev: 0.0
  mid360_l4_base_link:
    carla_type: sensor.lidar.ray_cast
    id: l4
    ros_config:
      frame_id: mid360_l4
      topic_base: /sensing/lidar/l4
      topic_suffix: /pointcloud_before_sync
      frequency_hz: 10
      qos_profile: best_effort
    parameters:
      range: 70
      channels: 64
      points_per_second: 200000
      horizontal_fov: 360.0
      upper_fov: 52.0
      lower_fov: -7.0
      rotation_frequency: 10
      noise_stddev: 0.0
  mid360_l5_base_link:
    carla_type: sensor.lidar.ray_cast
    id: l5
    ros_config:
      frame_id: mid360_l5
      topic_base: /sensing/lidar/l5
      topic_suffix: /pointcloud_before_sync
      frequency_hz: 10
      qos_profile: best_effort
    parameters:
      range: 70
      channels: 64
      points_per_second: 200000
      horizontal_fov: 360.0
      upper_fov: 52.0
      lower_fov: -7.0
      rotation_frequency: 10
      noise_stddev: 0.0
  CAM_FRONT/camera_link:
    carla_type: sensor.camera.rgb
    id: CAM_FRONT
    ros_config:
      frame_id: CAM_FRONT/camera_optical_link
      topic_image: /sensing/camera/CAM_FRONT/image_raw
      topic_info: /sensing/camera/CAM_FRONT/camera_info
      frequency_hz: 10
      qos_profile: reliable
    parameters:
      image_size_x: 1280
      image_size_y: 720
      fov: 90.0
  CAM_FRONT_LEFT/camera_link:
    carla_type: sensor.camera.rgb
    id: CAM_FRONT_LEFT
    ros_config:
      frame_id: CAM_FRONT_LEFT/camera_optical_link
      topic_image: /sensing/camera/CAM_FRONT_LEFT/image_raw
      topic_info: /sensing/camera/CAM_FRONT_LEFT/camera_info
      frequency_hz: 10
      qos_profile: reliable
    parameters:
      image_size_x: 1280
      image_size_y: 720
      fov: 90.0
  CAM_FRONT_RIGHT/camera_link:
    carla_type: sensor.camera.rgb
    id: CAM_FRONT_RIGHT
    ros_config:
      frame_id: CAM_FRONT_RIGHT/camera_optical_link
      topic_image: /sensing/camera/CAM_FRONT_RIGHT/image_raw
      topic_info: /sensing/camera/CAM_FRONT_RIGHT/camera_info
      frequency_hz: 10
      qos_profile: reliable
    parameters:
      image_size_x: 1280
      image_size_y: 720
      fov: 90.0
  CAM_BACK/camera_link:
    carla_type: sensor.camera.rgb
    id: CAM_BACK
    ros_config:
      frame_id: CAM_BACK/camera_optical_link
      topic_image: /sensing/camera/CAM_BACK/image_raw
      topic_info: /sensing/camera/CAM_BACK/camera_info
      frequency_hz: 10
      qos_profile: reliable
    parameters:
      image_size_x: 1280
      image_size_y: 720
      fov: 100.0
  CAM_BACK_LEFT/camera_link:
    carla_type: sensor.camera.rgb
    id: CAM_BACK_LEFT
    ros_config:
      frame_id: CAM_BACK_LEFT/camera_optical_link
      topic_image: /sensing/camera/CAM_BACK_LEFT/image_raw
      topic_info: /sensing/camera/CAM_BACK_LEFT/camera_info
      frequency_hz: 10
      qos_profile: reliable
    parameters:
      image_size_x: 1280
      image_size_y: 720
      fov: 100.0
  CAM_BACK_RIGHT/camera_link:
    carla_type: sensor.camera.rgb
    id: CAM_BACK_RIGHT
    ros_config:
      frame_id: CAM_BACK_RIGHT/camera_optical_link
      topic_image: /sensing/camera/CAM_BACK_RIGHT/image_raw
      topic_info: /sensing/camera/CAM_BACK_RIGHT/camera_info
      frequency_hz: 10
      qos_profile: reliable
    parameters:
      image_size_x: 1280
      image_size_y: 720
      fov: 100.0
  tamagawa/imu_link:
    carla_type: sensor.other.imu
    id: imu
    ros_config:
      frame_id: tamagawa/imu_link
      topic: /sensing/imu/tamagawa/imu_raw
      frequency_hz: 100
      qos_profile: reliable
    parameters:
      noise_accel_stddev_x: 0.0
      noise_accel_stddev_y: 0.0
      noise_accel_stddev_z: 0.0
      noise_gyro_stddev_x: 0.0
      noise_gyro_stddev_y: 0.0
      noise_gyro_stddev_z: 0.0
  gnss_link:
    carla_type: sensor.other.gnss
    id: gnss
    ros_config:
      frame_id: map
      topic: /sensing/gnss/pose_with_covariance
      frequency_hz: 10
      qos_profile: reliable
    parameters:
      noise_alt_stddev: 0.0
      noise_lat_stddev: 0.0
      noise_lon_stddev: 0.0
      noise_alt_bias: 0.0
      noise_lat_bias: 0.0
      noise_lon_bias: 0.0
    covariance:
      position_variance: 0.01
      orientation_variance: 1.0
normalization:
  strip_suffixes:
  - _base_link
  - _link
  - /camera_link
enabled_sensors:
- mid360_l1_base_link
- mid360_l2_base_link
- mid360_l3_base_link
- mid360_l4_base_link
- mid360_l5_base_link
- CAM_FRONT/camera_link
- CAM_FRONT_LEFT/camera_link
- CAM_FRONT_RIGHT/camera_link
- CAM_BACK/camera_link
- CAM_BACK_LEFT/camera_link
- CAM_BACK_RIGHT/camera_link
- tamagawa/imu_link
- gnss_link
vehicle_config:
  wheelbase: 1.2165
